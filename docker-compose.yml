services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    container_name: mlops-train
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - UV_NO_DEV=1
    # Run with: docker-compose run train

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: inference_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    env_file:
      - .env
    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      ]
      interval: 5s
      timeout: 2s
      retries: 20
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
